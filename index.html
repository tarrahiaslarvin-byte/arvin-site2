<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arvin | Personal Website</title>

<style>
body {
    margin: 0;
    background: #080b16;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.card {
    max-width: 400px;
    margin: 60px auto;
    padding: 30px 20px;
    background: #11182b;
    border-radius: 25px;
    border: 1px solid #7c3aed;
    width: 80%;
}

.avatar {
    width: 100px;
    height: 100px;
    margin: auto;
    border-radius: 50%;
    background: linear-gradient(45deg, #7c3aed, #06b6d4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
}

h1 {
    color: #a78bfa;
}

p {
    color: #cbd5e1;
    line-height: 1.8;
}

.tag {
    display: inline-block;
    background: #202945;
    padding: 10px;
    margin: 5px;
    border-radius: 15px;
}

a {
    display: block;
    margin-top: 25px;
    padding: 14px;
    background: #7c3aed;
    color: white;
    text-decoration: none;
    border-radius: 12px;
}
</style>
</head>

<body>
<div class="card">

    <div class="avatar">A</div>

    <h1>Hello, I'm Arvin!</h1>

    <p>
        Welcome to my personal website.
        I love coding, technology, and gaming.
    </p>

    <h3>My Interests</h3>

    <span class="tag">Coding</span>
    <span class="tag">Gaming</span>
    <span class="tag">Technology</span>

    <a href="https://github.com/">
        Visit GitHub
    </a>

</div>
</body>
</html>
